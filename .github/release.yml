# Groups the pull requests in auto-generated release notes by label,
# following the Keep a Changelog categories. A pull request without a
# matching label lands in "Other changes", so it is still listed; add a
# label at merge time to place it. Use "skip-changelog" to leave one out.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Breaking changes
      labels:
        - breaking
    - title: Added
      labels:
        - added
        - enhancement
    - title: Changed
      labels:
        - changed
    - title: Deprecated
      labels:
        - deprecated
    - title: Removed
      labels:
        - removed
    - title: Fixed
      labels:
        - fixed
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Internal
      labels:
        - internal
        - tests
        - ci
    - title: Other changes
      labels:
        - "*"
